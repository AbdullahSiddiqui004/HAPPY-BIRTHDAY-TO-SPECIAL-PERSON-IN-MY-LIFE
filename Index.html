<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffb6c1,#ffe4e1,#ffc0cb);
    text-align: center;
    color: #8b004b;
    overflow-x: hidden;
}

.container {
    margin: 100px 20px;
    padding: 30px 15px;
    background: rgba(255,255,255,0.75);
    border-radius: 25px;
    box-shadow: 0 0 25px #ff69b4;
}

h1 {
    font-size: 35px;
    color: #e60073;
}

.heart {
    font-size: 55px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.3); }
}

p {
    font-size: 18px;
    line-height: 1.7;
}

#countdown {
    font-size: 23px;
    font-weight: bold;
    color: #d60067;
}

button {
    background: #e60073;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 25px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 15px;
}

#message {
    display: none;
    font-size: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<div class="heart">❤️</div>

<h1>Happy Birthday!</h1>

<h2>To Someone Special 🌹</h2>

<p>
May your life always be filled with happiness,
beautiful moments and endless smiles.
May Allah bless you with success and peace.
</p>

<h3>🎂 27 November 🎂</h3>

<div id="countdown"></div>
